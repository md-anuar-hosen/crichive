name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

jobs:
  typecheck-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # Only the DB-free domain unit tests run in CI. The rest of the suite
      # (tests/*.test.ts, excluding tests/domain/) is integration-level and
      # hits a live shared Neon dev database via DATABASE_URL — wiring that
      # into CI needs a deliberate call on either a dedicated CI database or
      # exposing dev DB credentials as a GitHub secret, which wasn't made
      # here. Run `pnpm test` locally for full coverage before merging.
      - run: pnpm run test:unit
